<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>حاسبة الزجاج | BDAWY</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <meta
        name="application-name"
        content="BDAWY Glass Calculator"
    >

</head>


<body>


    <!-- =========================
         زر الحافظة
    ========================== -->

    <button
        id="clipboardToggle"
        class="clipboard-toggle"
        type="button"
        aria-label="فتح الحافظة"
    >
        📂
    </button>


    <!-- =========================
         الحافظة
    ========================== -->

    <aside
        id="clipboardPanel"
        class="clipboard-panel"
        aria-hidden="true"
    >

        <div class="clipboard-panel-header">

            <h2>📂 الحافظة</h2>

            <button
                id="clipboardClose"
                type="button"
                aria-label="إغلاق الحافظة"
            >
                ✕
            </button>

        </div>


        <textarea
            id="noteInput"
            rows="6"
            placeholder="اكتب أي حاجة..."
        ></textarea>


        <button
            id="saveCalculationBtn"
            class="save-calculation-btn"
            type="button"
        >
            💾 حفظ
        </button>


        <div
            id="savedCalculations"
            class="saved-calculations"
        >

            <p class="empty-saved">
                لا توجد ملاحظات محفوظة
            </p>

        </div>

    </aside>


    <!-- =========================
         التطبيق
    ========================== -->

    <main class="app">


        <!-- =========================
             الهيدر
        ========================== -->

        <header class="header">

            <div class="brand">

                <h2>BDAWY</h2>

                <p>01285663869</p>

            </div>


            <h1>
                🪟 حاسبة الزجاج
            </h1>


            <p>
                احسب السعر والمساحة بسهولة
            </p>

        </header>


        <!-- =========================
             الحاسبة
        ========================== -->

        <section class="calculator">


            <!-- =========================
                 نوع العملية
            ========================== -->

            <div class="field">

                <label for="operation">
                    نوع العملية
                </label>


                <select id="operation">

                    <option value="subtract">
                        طرح
                    </option>

                    <option value="add">
                        جمع
                    </option>

                    <option value="multiply">
                        حاسبة السعر
                    </option>

                    <option value="divide">
                        قسمة
                    </option>

                </select>

            </div>


            <!-- =========================
                 العمليات العادية
            ========================== -->

            <div id="normalMode">


                <!-- الرقم الأساسي -->

                <div class="field">

                    <label for="numberInput">
                        الرقم الأساسي
                    </label>


                    <input
                        id="numberInput"
                        type="number"
                        inputmode="decimal"
                        step="any"
                        placeholder="اكتب الرقم"
                    >

                </div>


                <!-- الرقم الثابت -->

                <div class="field">

                    <label for="constantInput">
                        الرقم الثابت
                    </label>


                    <input
                        id="constantInput"
                        type="number"
                        inputmode="decimal"
                        step="any"
                        value="1.6"
                    >

                </div>

            </div>


            <!-- =========================
                 حاسبة السعر
            ========================== -->

            <div
                id="glassMode"
                class="hidden"
            >


                <!-- الطول والعرض -->

                <div class="row">


                    <div class="field">

                        <label for="lengthInput">
                            الطول (سم)
                        </label>


                        <input
                            id="lengthInput"
                            type="number"
                            inputmode="decimal"
                            step="any"
                            min="0"
                            placeholder="مثال: 200"
                        >

                    </div>


                    <div class="field">

                        <label for="widthInput">
                            العرض (سم)
                        </label>


                        <input
                            id="widthInput"
                            type="number"
                            inputmode="decimal"
                            step="any"
                            min="0"
                            placeholder="مثال: 100"
                        >

                    </div>

                </div>


                <!-- عدد القطع والسعر -->

                <div class="row">


                    <div class="field">

                        <label for="piecesInput">
                            عدد القطع
                        </label>


                        <input
                            id="piecesInput"
                            type="number"
                            inputmode="numeric"
                            step="1"
                            min="1"
                            placeholder="مثال: 3"
                        >

                    </div>


                    <div class="field">

                        <label for="priceInput">
                            السعر للمتر المربع
                        </label>


                        <input
                            id="priceInput"
                            type="number"
                            inputmode="decimal"
                            step="any"
                            min="0"
                            placeholder="مثال: 500"
                        >

                    </div>

                </div>

            </div>


            <!-- =========================
                 النتيجة
            ========================== -->

            <div class="result-box">

                <span>
                    الإجمالي
                </span>


                <strong id="result">
                    —
                </strong>


                <p id="formula">
                    اكتب البيانات للبدء
                </p>

            </div>


        </section>


    </main>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="./app.js"></script>


</body>

</html>
